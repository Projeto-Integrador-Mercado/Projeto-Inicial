name: Padrões de contribuição

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Validar contribuição
    runs-on: ubuntu-latest
    steps:
      - name: Validar metadados e commits sem executar código do PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, re, urllib.request

          types = 'feat|fix|docs|test|build|perf|style|refactor|chore|ci|raw|cleanup|remove|init|revert|security'
          pattern = re.compile(r'^(?:(?::[a-z0-9_+-]+:|[^\w\s]+) )?(' + types + r')(?:\([a-z0-9][a-z0-9_./-]*\))?!?: \S[^\r\n]*$')
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          pr = event['pull_request']
          errors = []
          if not pattern.fullmatch(pr['title']):
              errors.append('Título do PR fora do padrão tipo(escopo): descrição.')
          base, head = pr['base']['ref'], pr['head']['ref']
          same_repo = (pr['head'].get('repo') or {}).get('full_name') == pr['base']['repo']['full_name']
          if base == 'main' and not (head == 'dev' and same_repo):
              errors.append('PR para main deve vir da dev deste repositório.')
          if base == 'dev' and not ((head == 'main' and same_repo) or re.fullmatch(r'(' + types + r')/[a-z0-9][a-z0-9-]*', head)):
              errors.append('PR para dev exige branch tipo/descricao ou sincronização da main deste repositório.')
          count = 0
          page = 1
          while True:
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{pr['number']}/commits?per_page=100&page={page}"
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  commits = json.load(response)
              for commit in commits:
                  count += 1
                  if (base == 'dev' and head == 'main' and same_repo) or len(commit['parents']) > 1:
                      continue
                  subject = commit['commit']['message'].splitlines()[0]
                  if not pattern.fullmatch(subject):
                      errors.append(f"Commit {commit['sha'][:7]} fora do padrão.")
              if len(commits) < 100:
                  break
              page += 1
          if count != pr['commits']:
              errors.append('Lista de commits incompleta ou PR alterado durante a verificação; execute novamente.')
          if errors:
              for error in errors:
                  print('::error::' + error)
              raise SystemExit(1)
          print(f'Título, branches e {count} commits verificados.')
